<style>
@font-face{font-family:'Press Start 2P';src:url(assets/fonts/ps2p.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Rubik';font-weight:500;src:url(assets/fonts/rubik-he-500.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F;font-display:swap}
@font-face{font-family:'Rubik';font-weight:500;src:url(assets/fonts/rubik-la-500.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'Rubik';font-weight:700;src:url(assets/fonts/rubik-he-700.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F;font-display:swap}
@font-face{font-family:'Rubik';font-weight:700;src:url(assets/fonts/rubik-la-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'Rubik';font-weight:900;src:url(assets/fonts/rubik-he-900.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F;font-display:swap}
@font-face{font-family:'Rubik';font-weight:900;src:url(assets/fonts/rubik-la-900.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
:root{--y:#ffc93a;--o:#ff5a1f;--c:#45d2ff;--g:#3dff8a;--bg:#0b0d12;--panel:rgba(12,14,20,.78);--line:rgba(255,201,58,.55);--f:'Press Start 2P','Rubik',system-ui,sans-serif;--h:'Rubik',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--h);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.45) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,rgba(255,40,20,0) 35%,rgba(255,30,20,.55) 100%);opacity:0;transition:opacity .25s}
button{font-family:inherit;color:inherit;cursor:pointer}
.hid{display:none!important}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh;gap:18px;background:linear-gradient(180deg,rgba(11,13,18,.1),rgba(11,13,18,.85)),url(assets/art/loading.webp) center/cover,var(--bg)}
#load .bar{width:min(320px,70vw);height:10px;border:2px solid var(--y);border-radius:6px;overflow:hidden}
#load .fill{height:100%;width:0;background:linear-gradient(90deg,var(--o),var(--y));transition:width .2s}
.logo{font-family:'Press Start 2P',monospace;font-size:clamp(22px,6.5vw,46px);color:var(--y);letter-spacing:3px;line-height:1.35;text-align:center;text-shadow:0 0 12px rgba(255,120,0,.65),3px 3px 0 #6b2200;direction:ltr}
.logo small{display:block;font-size:.42em;color:var(--c);letter-spacing:6px;text-shadow:0 0 10px rgba(0,160,255,.6);margin-top:6px}
/* ---------- menu (over live 3D attract scene) ---------- */
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(8,10,16,.82) 0%,rgba(8,10,16,.05) 30%,rgba(8,10,16,.05) 52%,rgba(8,10,16,.88) 100%);overflow-y:auto}
#menu .top{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
#menu .sub{font-size:clamp(12px,3.4vw,16px);color:#d8e6f2;text-shadow:0 1px 4px #000}
.iconrow{display:flex;gap:8px;width:100%;justify-content:flex-end}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(10,12,18,.6);font-size:19px;display:flex;align-items:center;justify-content:center}
.bottom{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:10px}
.dd{font-size:12px;color:#cfe3f2;text-shadow:0 1px 3px #000;margin-top:-4px}.touch #pcSeg{display:none}.lbl{font-size:12px;color:var(--y);letter-spacing:1px;font-weight:700}
.seg{display:flex;gap:6px;background:rgba(10,12,18,.65);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:700;color:#cfd8e2}
.seg button.on{background:var(--y);color:#1b1300}
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.prow{display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
.ptag{font-family:'Press Start 2P';font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);opacity:.9}
.hc{flex:1;max-width:190px;min-width:96px;background:rgba(12,14,20,.72);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:6px 6px 8px;text-align:center;transition:transform .12s,border-color .15s}
.hc.on{border-color:var(--g);box-shadow:0 0 18px rgba(61,255,138,.35);transform:translateY(-2px)}
.hc img{width:100%;aspect-ratio:240/170;object-fit:contain;display:block}
.hc .nm{font-size:13px;font-weight:900;color:var(--y);direction:ltr}
.hc .ds{font-size:11px;color:#b9c6d3;margin:2px 0 4px}
.st{display:grid;grid-template-columns:auto 1fr;gap:3px 6px;align-items:center;font-size:10px;color:#9fb0c0;text-align:start}
.st i{display:block;height:5px;border-radius:3px;background:#283040;overflow:hidden}.st i b{display:block;height:100%}
.big{font-family:'Press Start 2P','Rubik';font-size:clamp(14px,3.6vw,18px);padding:16px 34px;border-radius:14px;border:3px solid var(--y);background:linear-gradient(180deg,#ff7a2a,#e8400e);box-shadow:0 0 22px rgba(255,90,20,.55),inset 0 2px 0 rgba(255,255,255,.3);letter-spacing:2px}
.big:active{transform:scale(.96)}
.keys{font-size:11px;color:#9aa8b6;text-align:center;line-height:1.7}.keys span{display:inline-block;unicode-bidi:isolate;margin:0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn2{font-size:14px;font-weight:700;padding:10px 16px;border-radius:12px;border:1.5px solid var(--c);background:rgba(10,14,22,.7);color:var(--c)}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,10,.72);backdrop-filter:blur(3px)}
.card{width:min(460px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#151924,#0d1017);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card h2{font-family:'Press Start 2P','Rubik';font-size:15px;color:var(--y);margin-bottom:14px;text-align:center;line-height:1.5}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}.hdr h2{flex:1;margin:0}
.backb{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);border-radius:10px;padding:6px 10px;font-size:13px}
table.hs{width:100%;border-collapse:collapse;font-size:14px}
table.hs th{color:var(--y);font-size:12px;border-bottom:2px solid var(--y);padding:6px}
table.hs td{padding:6px;text-align:center;color:#cfe8ff;border-bottom:1px solid rgba(255,255,255,.06)}
table.hs tr.me td{color:var(--g);font-weight:900}
table.hs td.sc{font-family:'Press Start 2P';font-size:11px;direction:ltr}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.set .seg button{padding:6px 12px;font-size:13px}
.guide p{font-size:15px;line-height:1.6;margin-bottom:10px;color:#dde6ee}
.ab{font-size:14px;line-height:1.7;color:#cfd8e2}
.ab .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;margin:10px 0}
.ab .kv b{color:#9fb0c0;font-weight:500}
.ab a,.ab button.lnk{display:block;width:100%;text-align:start;margin:6px 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;text-decoration:none;font-size:14px}
.ab .cr{font-size:12px;color:#9fb0c0;margin-top:10px}
.ab .disc{font-size:12px;color:#8592a0;margin-top:8px}
#ni{font-family:'Rubik',sans-serif;font-weight:900;font-size:24px;letter-spacing:2px;text-align:center;width:min(280px,80vw);padding:10px;background:#0a0c12;color:var(--y);border:3px solid var(--y);border-radius:10px;margin:10px auto;display:block}
.center{text-align:center}.mt{margin-top:12px}
.fs{font-family:'Press Start 2P';color:var(--g);font-size:clamp(16px,4.5vw,24px);text-shadow:0 0 10px rgba(61,255,138,.5);direction:ltr;display:inline-block;margin:6px 0 10px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
.hrow{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;direction:ltr}
.hb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px;box-shadow:0 0 10px rgba(0,0,0,.4)}
.hb .k{font-family:'Press Start 2P';font-size:7px;color:var(--y);letter-spacing:1px}
#sv{font-family:'Press Start 2P';font-size:15px;margin-top:3px;text-shadow:0 0 8px rgba(255,201,58,.6)}
#cw{font-family:'Press Start 2P';font-size:8px;color:var(--o);margin-top:3px;min-height:9px}
.php{margin-bottom:4px;width:118px}.php .n{font-family:'Press Start 2P';font-size:7px;margin-bottom:3px}
.pbo{height:8px;background:#1d222c;border-radius:4px;overflow:hidden}.pbi{height:100%;background:linear-gradient(90deg,#26d36a,#b5ff3c);transition:width .15s}
.pbi.low{background:linear-gradient(90deg,#ff3b2f,#ff9a1f)}.pbi.dead{background:#555}
#lw,#bw{font-size:12px;margin-top:2px;letter-spacing:1px}
#wn{font-size:12px;font-weight:900;color:#e6f7ff;margin-top:2px}
#wto{height:4px;background:#1d222c;border-radius:2px;margin-top:3px;overflow:hidden}#wtb{height:100%;background:var(--c)}
#mid{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 80px);left:0;right:0;text-align:center;text-shadow:0 1px 3px #000}
#cry{font-size:13px;font-weight:900;color:#7dffa0;margin-top:3px}#cry.full{color:#ffe14a}
.coinl{font-size:15px;font-weight:900;color:#ffd84a;margin:4px 0}
.wal{font-family:'Press Start 2P','Rubik';font-size:16px;color:#ffd84a;text-align:center;margin:4px 0 10px}
.urow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}.urow .ic{font-size:24px;width:32px;text-align:center}.urow .tx{flex:1;min-width:0}.urow .tx b{font-size:15px}.urow .tx small{display:block;font-size:12px;color:#9fb0c0}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.on{background:#3dff8a}
.ubuy{font-size:13px;font-weight:900;padding:8px 10px;border-radius:10px;border:1.5px solid #ffd84a;background:rgba(40,32,6,.7);color:#ffd84a;white-space:nowrap}.ubuy.no{opacity:.45}.ubuy.mx{border-color:#3dff8a;color:#3dff8a}
#wavl{font-family:'Press Start 2P','Rubik';font-size:9px;color:var(--y)}#msn{font-size:12px;color:#fff59a;margin-top:3px;font-weight:700}
#pauseB{pointer-events:auto;position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 80px);inset-inline-end:10px;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:var(--panel);font-size:16px}
#bbw{position:absolute;bottom:max(150px,calc(env(safe-area-inset-bottom) + 150px));left:50%;transform:translateX(-50%);width:min(320px,62vw)}
#bbl{font-family:'Rubik';font-weight:900;font-size:13px;letter-spacing:1px;color:#ffe0d8 !important;color:#ff5040;text-align:center;margin-bottom:4px;text-shadow:0 0 8px #f00}
#bbo{height:12px;border:2px solid #ff4030;border-radius:6px;background:#2a0505;overflow:hidden}#bbi{height:100%;background:linear-gradient(90deg,#ff1a1a,#ff8a1a);transition:width .15s}
#mm{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));inset-inline-start:10px;width:74px;height:104px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.4);overflow:hidden}
#ml{position:fixed;inset:0;z-index:25;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#bm{font-family:'Press Start 2P','Rubik';font-size:clamp(15px,4.4vw,30px);color:var(--y);text-shadow:0 0 12px #f60,0 3px 0 #5a1d00;opacity:0;transition:opacity .3s;text-align:center;padding:0 12px;line-height:1.5}
#km{font-family:'Press Start 2P';font-size:clamp(11px,3vw,20px);color:#ff4a3a;text-shadow:0 0 10px #f00;opacity:0;transition:opacity .25s}
/* touch */
#tc{position:fixed;inset:0;z-index:22;pointer-events:none}
#jz{position:absolute;left:16px;bottom:max(16px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.22);pointer-events:auto}
#jk{position:absolute;left:32px;top:32px;width:62px;height:62px;border-radius:50%;background:rgba(255,201,58,.32);border:2px solid rgba(255,201,58,.75)}
#fb{position:absolute;right:18px;bottom:max(26px,calc(env(safe-area-inset-bottom) + 16px));width:86px;height:86px;border-radius:50%;background:rgba(255,80,20,.28);border:3px solid rgba(255,110,30,.85);font-family:'Press Start 2P';font-size:10px;display:flex;align-items:center;justify-content:center;pointer-events:auto;text-align:center;line-height:1.6}
#bb{position:absolute;right:26px;bottom:max(126px,calc(env(safe-area-inset-bottom) + 116px));width:62px;height:62px;border-radius:50%;background:rgba(255,0,170,.2);border:3px solid rgba(255,40,200,.75);font-size:22px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#fb.act{background:rgba(255,90,20,.55)}#bb.act{background:rgba(255,0,170,.5)}
.touch #mm{bottom:auto;top:calc(max(8px,env(safe-area-inset-top)) + 64px)}
#toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:95;background:rgba(10,12,18,.92);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#err{position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:11px;padding:6px;z-index:999;display:none;direction:ltr}
@media (orientation:landscape) and (max-height:560px){
 #menu{padding-top:6px;padding-bottom:6px;justify-content:space-between}
 #menu .logo{font-size:20px;line-height:1.1}#menu .logo small{display:inline;font-size:.6em;margin:0 0 0 8px}#menu .sub{display:none}
 .iconrow{position:absolute;top:8px;inset-inline-end:8px;width:auto}.ib{width:36px;height:36px;font-size:16px}
 .bottom{gap:6px;max-width:640px}.dd{display:none}.seg button{padding:5px 10px;font-size:12px}.lbl{font-size:11px}
 .hc{padding:3px 4px 5px;max-width:150px}.hc img{max-height:52px}.hc .st{display:none}.hc .ds{margin:0;font-size:10px}.hc .nm{font-size:11px}
 .big{padding:10px 26px;font-size:13px}.keys{display:none}.btn2{padding:6px 12px;font-size:12px}
 #bGuide{position:absolute;bottom:8px;inset-inline-start:8px}#bOnline{position:absolute;bottom:8px;inset-inline-end:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
